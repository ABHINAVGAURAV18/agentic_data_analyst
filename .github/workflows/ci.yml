name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test-admin
          POSTGRES_DB: analyst
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d analyst"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_ADMIN_URL: postgresql+asyncpg://postgres:test-admin@localhost:5432/analyst
      TEST_READER_URL: postgresql+asyncpg://analyst_reader:test-reader@localhost:5432/analyst
      TEST_AUDIT_URL: postgresql+asyncpg://analyst_audit:test-audit@localhost:5432/analyst
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - run: uv sync --frozen
      - run: uv run ruff check src tests evals scripts
      - run: uv run ruff format --check src tests evals scripts
      - run: uv run pytest --cov=analyst --cov-report=term-missing --cov-report=xml
      - run: uv run python evals/run.py
      - run: docker build -t analyst:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            coverage.xml
            evals/latest-results.json
