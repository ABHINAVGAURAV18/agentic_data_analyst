[project]
name = "agentic-data-analyst"
version = "0.1.0"
description = "Bounded, evidence-backed sales analysis with LangGraph and MCP"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "langgraph>=1,<2",
  "mcp>=1.12,<2", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1", "aiosqlite>=0.20,<1", "redis>=5,<7",
  "httpx>=0.28,<1", "prometheus-client>=0.21,<1", "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "pytest-cov>=6,<8", "ruff>=0.11,<1", "fakeredis>=2.27,<3", "pyyaml>=6,<7"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and Redis"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"evals/*.py" = ["ASYNC240"]
"tests/*.py" = ["ASYNC240"]
